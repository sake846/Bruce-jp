
[env:lilygo-t-embed-cc1101]
board = lilygo-t-embed-cc1101
board_build.arduino.memory_type = qio_opi
board_build.partitions = custom_16Mb.csv
build_src_filter =${env.build_src_filter} +<modules/wifi/esp_sdr/**> +<../boards/lilygo-t-embed-cc1101>
build_flags =
	${env.build_flags}
	-Iboards/lilygo-t-embed-cc1101
	-O2
	-DMIC_SPM1423
	-DCORE_DEBUG_LEVEL=1
	-DCONFIG_ESP_SDR_BRUCE=1
	-DCONFIG_ESP_SDR_LILYGO=1
	-DCONFIG_ESP_SDR_LILYGO_T_EMBED_CC1101=1
	-Isrc/modules/wifi/esp_sdr/common
	-Isrc/modules/wifi/esp_sdr/boards
	-Isrc/modules/wifi/esp_sdr/diagnostics
	-Isrc/modules/wifi/esp_sdr/targets/esp32s3
	-Wl,--wrap=chip_v7_set_chan_ana
	-Wl,--wrap=set_rx_gain_cal_dc
	-Wl,--wrap=set_rx_gain_table

	-DRF_TX_PINS='{{"Pin 43", 43}, {"Pin 44", 44}}'
	-DRF_RX_PINS='{{"Pin 43", 43}, {"Pin 44", 44}}'
	-DIR_TX_PINS='{{"Default", 2}, {"Pin 43", 43}, {"Pin 44", 44}}'
	-DIR_RX_PINS='{{"Default", 1}, {"Pin 43", 43}, {"Pin 44", 44}}'
	-DDEVICE_NAME='"Lilygo T-Embed CC1101"'

lib_deps =
	${env.lib_deps}
	lewisxhe/XPowersLib @^0.3.3
